name: Deploy website to S3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "_old/*" \
            --exclude ".gitignore"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID="$CF_ID"
          if [ -z "$DIST_ID" ]; then
            echo "No CLOUDFRONT_DISTRIBUTION_ID secret set; auto-discovering by alias..."
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Aliases.Items, 'resume.eholmes.net')].Id | [0]" \
              --output text)
          fi
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "ERROR: could not determine CloudFront distribution ID for resume.eholmes.net"
            exit 1
          fi
          echo "Invalidating CloudFront distribution $DIST_ID"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
